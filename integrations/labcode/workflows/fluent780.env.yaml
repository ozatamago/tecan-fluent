# The labcode environment of the Fluent 780 workflows (colour_water_layout, colour_water_w01_w21): HOW each process
# of lib/fluent780_processes.yaml is carried out on the RIKEN BDR Fluent 780, through the combined SiLA2 server of
# the Tecan Fluent connector ("Tecan Fluent 780 (All devices)").
#
# - One device, fluent_control: every operation goes to the same server and holds it exclusively, so the operations
#   never overlap (labcode run management specification, 2026-11-14, S03). Its one spot, deck, is where the Workcell
#   Object rests between operations; nothing is transported by labcode.
# - Each mode's script is flavor sila2: labcode connects `sila2_client` to the server for the operation. The scripts
#   use fluent780_labcode.steps.Step, which checks that the mission's FluentControl run is still the open one before
#   every command, records each command in the mission's events.jsonl and waits for it to finish. A script never ends
#   the run, resends a command or cleans up after a failure; the run manager does what the failure policy says.
# - Durations are the scheduler's estimates in seconds (from the 2026-11-19 runs); the real time is the instrument's.
#   A pipetting process is one whole transfer (GetTips ... DropTips), so its estimate is per transfer.
#
# The server address: 10.5.1.156:50060 is the server on the Fluent PC. When labcode runs on a Mac with the SSH
# forwarding to the Fluent PC, use host 127.0.0.1 (localhost:50060). The run manager can override it for a test
# server (--endpoint, loopback only).
time:
  unit: second

x-labcode:
  # One operation may take this long (real seconds) before labcode stops waiting. The per-command limits in the
  # scripts are shorter, so they fire first and name the command.
  op_timeout: 1800

devices:
  - id: fluent_control
    spots: [deck]
    x-labcode:
      connection: { kind: sila2, host: 10.5.1.156, port: 50060, insecure: true }

processes:
  add_lid:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 3
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # AddLabware at the holder's cover site. A lid that FluentControl already has (e.g. after an interrupted
              # run) is kept, as the 2026-11-18 scripts did; any other refusal fails the step.
              from fluent780_labcode.steps import Step
              step = Step(sila2_client, cell)
              location, site = step.cover_site(holder)
              try:
                  step.call("Labware", "AddLabware", lid, lid_type, location, site, label=f"AddLabware {lid} on {holder}")
              except Exception as exc:
                  if "already exists" not in str(exc):
                      raise
                  step.mission.event("kept", label=f"{lid} already registered")
              return {}

  remove_lid:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 13
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "Labware", "TransferLabware", lid, location, site, label=f"{lid} -> {location}[{site}]"
              )
              return {}

  put_lid_on:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 12
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # TransferLabware to GetCoverSiteName("<holder>") and its resolved index (FixedSite), not PutLidOn:
              # PutLidOn is refused for a plate the connector tracks (plate B) and stalls FluentControl when the lid
              # already lies there (2026-11-18).
              from fluent780_labcode.steps import Step
              step = Step(sila2_client, cell)
              location, site = step.cover_site(holder)
              step.call("Labware", "TransferLabware", lid, location, site, label=f"{lid} -> lid of {holder}")
              return {}

  move_plate:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 11
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "Labware", "TransferLabware", plate, location, site, label=f"{plate} -> {location}[{site}]"
              )
              return {}

  transfer_plate:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 23
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "PlateTransfer", "MoveLabware", plate, location, site, label=f"{plate} -> {location}[{site}]"
              )
              return {}

  measure_absorbance:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 300
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # The Infinite 200 PRO through the Fluent: Regrip, reader, measure, and back (about 5 minutes).
              from fluent780_labcode.steps import Step
              reading = Step(sila2_client, cell).measure(plate, method, allow_missing_result=allow_missing_result)
              return {"reading": reading}

  set_incubator_temperature:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "Incubator1", "SetTemperature", temperature, label=f"Incubator1 SetTemperature {temperature}"
              )
              return {}

  close_incubator_door:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call("Incubator1", "CloseDoor", label="Incubator1 CloseDoor")
              return {}

  start_incubator_shaker:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 7
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "Incubator1", "StartShaker", frequency, label=f"Incubator1 StartShaker {frequency} Hz"
              )
              return {}

  stop_incubator_shaker:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call("Incubator1", "StopShaker", label="Incubator1 StopShaker")
              return {}

  hold:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 30
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).hold(seconds, scale)
              return {}

  transfer_liquid:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 45
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # One channel, a new tip per target well (GetTips ... DropTips, all in this operation).
              from fluent780_labcode.pipetting import Pipetting
              from fluent780_labcode.steps import Step
              Pipetting(Step(sila2_client, cell)).transfer(
                  tips, source, source_well, volume, target, target_wells, liquid_class, mix_volume, mix_cycles, mix_liquid_class
              )
              return {}

  transfer_liquid_multi:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 35
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # Several channels, one plate column at a time, split where the rack's column runs out.
              from fluent780_labcode.pipetting import Pipetting
              from fluent780_labcode.steps import Step
              Pipetting(Step(sila2_client, cell)).transfer_multi(
                  tips, source, source_well, volume, target, target_wells, liquid_class, mix_volume, mix_cycles, mix_liquid_class
              )
              return {}

  mix_wells_multi:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 30
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.pipetting import Pipetting
              from fluent780_labcode.steps import Step
              Pipetting(Step(sila2_client, cell)).mix_multi(tips, target, target_wells, mix_volume, mix_cycles, mix_liquid_class)
              return {}

  set_plate_temperature:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "CoolingHeatingPlates", "SetTemperature", slot, temperature, label=f"CPLC slot {slot} -> {temperature} C"
              )
              return {}

  set_shaker_temperature:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call("BioShake", "SetTemperature", temperature, label=f"BioShake -> {temperature} C")
              return {}

  wait_shaker_temperature:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 10
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # BioShake.ReadTemperature (the driver-reported value) until it is at least `minimum`.
              from fluent780_labcode.steps import Step
              value = Step(sila2_client, cell).wait_temperature("BioShake", "ReadTemperature", minimum, interval, timeout)
              return {"temperature": value}

  shaker_temperature_off:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call("BioShake", "TemperatureOff", label="BioShake temperature off")
              return {}

  lock_shaker_plate:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call("BioShake", "LockPlate", label="BioShake LockPlate")
              return {}

  unlock_shaker_plate:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 3
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call("BioShake", "UnlockPlate", label="BioShake UnlockPlate")
              return {}

  take_photo:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 5
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # A failed image is recorded and does not stop the run (as in the 2026-11-19 run).
              from fluent780_labcode.steps import Step
              step = Step(sila2_client, cell)
              try:
                  step.call("DeckCamera", "TakeImage", camera, label=f"photo {camera}", timeout=120)
              except Exception as exc:
                  step.mission.event("note", label=f"photo {camera}", note=f"{type(exc).__name__}: {exc}")
              return {}

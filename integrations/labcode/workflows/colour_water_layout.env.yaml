# The labcode environment for colour_water_layout.workflow.yaml: HOW each step is carried out on the RIKEN BDR
# Fluent 780, through the combined SiLA2 server of the Tecan Fluent connector ("Tecan Fluent 780 (All devices)").
#
# - One device, fluent_control: every operation goes to the same server and holds it exclusively, so the operations
#   never overlap (labcode run management specification, 2026-11-14, S03). Its one spot, deck, is where the Workcell
#   Object rests between operations; nothing is transported by labcode.
# - Each mode's script is flavor sila2: labcode connects `sila2_client` to the server for the operation. The scripts
#   use fluent780_labcode.steps.Step, which checks that the mission's FluentControl run is still the open one before
#   every command, records each command in the mission's events.jsonl and waits for it to finish. A script never ends
#   the run, resends a command or cleans up after a failure; the run manager does what the failure policy says.
# - Durations are the scheduler's estimates in seconds (from the 2026-11-19 run); the real time is the instrument's.
#
# The server address: 10.5.1.156:50060 is the server on the Fluent PC. When labcode runs on a Mac with the SSH
# forwarding to the Fluent PC, use host 127.0.0.1 (localhost:50060). The run manager can override it for a test
# server (--endpoint, loopback only).
time:
  unit: second

x-labcode:
  # One operation may take this long (real seconds) before labcode stops waiting. The per-command limits in the
  # scripts are shorter, so they fire first and name the command.
  op_timeout: 1800

devices:
  - id: fluent_control
    spots: [deck]
    x-labcode:
      connection: { kind: sila2, host: 10.5.1.156, port: 50060, insecure: true }

processes:
  add_lid:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 3
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # AddLabware at the holder's cover site. A lid that FluentControl already has (e.g. after an interrupted
              # run) is kept, as the 2026-11-18 scripts did; any other refusal fails the step.
              from fluent780_labcode.steps import Step
              step = Step(sila2_client, cell)
              location, site = step.cover_site(holder)
              try:
                  step.call("Labware", "AddLabware", lid, lid_type, location, site, label=f"AddLabware {lid} on {holder}")
              except Exception as exc:
                  if "already exists" not in str(exc):
                      raise
                  step.mission.event("kept", label=f"{lid} already registered")
              return {}

  remove_lid:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 13
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "Labware", "TransferLabware", lid, location, site, label=f"{lid} -> {location}[{site}]"
              )
              return {}

  put_lid_on:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 12
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # TransferLabware to GetCoverSiteName("<holder>") and its resolved index (FixedSite), not PutLidOn:
              # PutLidOn is refused for a plate the connector tracks (plate B) and stalls FluentControl when the lid
              # already lies there (2026-11-18).
              from fluent780_labcode.steps import Step
              step = Step(sila2_client, cell)
              location, site = step.cover_site(holder)
              step.call("Labware", "TransferLabware", lid, location, site, label=f"{lid} -> lid of {holder}")
              return {}

  move_plate:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 11
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "Labware", "TransferLabware", plate, location, site, label=f"{plate} -> {location}[{site}]"
              )
              return {}

  transfer_plate:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 23
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "PlateTransfer", "MoveLabware", plate, location, site, label=f"{plate} -> {location}[{site}]"
              )
              return {}

  measure_absorbance:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 310
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              # The Infinite 200 PRO through the Fluent: Regrip, reader, measure, and back (about 5 minutes).
              from fluent780_labcode.steps import Step, absorbance_reading
              responses = Step(sila2_client, cell).call(
                  "PlateHandling", "MeasureWorktablePlate", plate, method,
                  label=f"Measure {plate} in the reader ({method})", timeout=900,
              )
              return {"reading": absorbance_reading(responses)}

  set_incubator_temperature:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "Incubator1", "SetTemperature", temperature, label=f"Incubator1 SetTemperature {temperature}"
              )
              return {}

  close_incubator_door:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call("Incubator1", "CloseDoor", label="Incubator1 CloseDoor")
              return {}

  start_incubator_shaker:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 7
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call(
                  "Incubator1", "StartShaker", frequency, label=f"Incubator1 StartShaker {frequency} Hz"
              )
              return {}

  stop_incubator_shaker:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 2
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).call("Incubator1", "StopShaker", label="Incubator1 StopShaker")
              return {}

  hold:
    modes:
      - id: fluent780
        devices: [fluent_control]
        duration: 10
        input_spots: { cell: fluent_control.deck }
        output_spots: { cell: fluent_control.deck }
        x-labcode:
          script:
            language: python
            flavor: sila2
            code: |
              from fluent780_labcode.steps import Step
              Step(sila2_client, cell).hold(seconds)
              return {}

[project]
name = "fluent780-labcode"
version = "0.1.0"
description = "Run Fluent 780 workflows from labcode (ofplang) through the Tecan Fluent connector's SiLA2 server"
requires-python = ">=3.10"
dependencies = [
    "labcode[sila2]==0.10.10",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluent780_labcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs lc run against a loopback fake SiLA2 server (about a minute)"]

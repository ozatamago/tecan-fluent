[project]
name = "unitelabs-tecan-fluent"
version = "0.1.0"
description = "SiLA 2 connector for the RIKEN BDR Tecan Fluent 780 and its devices, driven through FluentControl, built with the UniteLabs CDK"
readme = "README.md"
authors = [
    { name = "Yusuke Ozaki", email = "109056512+ozatamago@users.noreply.github.com" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "pylabrobot[usb]",
    "sila2==0.14.0",
    "unitelabs-cdk~=0.13.6",
]

[project.urls]
repository = "https://github.com/ozatamago/riken-odtc-connector"
"Bug Tracker" = "https://github.com/ozatamago/riken-odtc-connector/issues"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]
dev = [
    "ruff",
    "pre-commit",
    "commitizen",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unitelabs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# commitizen (dev extra) caps deprecated below 2; without this the lock would downgrade the deprecated 3.0 that
# unitelabs-cdk uses at run time
override-dependencies = ["deprecated>=1.2.13"]

[tool.uv.sources]
pylabrobot = { git = "https://github.com/PyLabRobot/pylabrobot.git", rev = "183cabd61fd37b97375c97f136a9eca5252ce2b8" }
